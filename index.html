<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Wrapped 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Space+Grotesk", sans-serif;
        background-color: #000000;
        color: #ffffff;
      }
      .neobrutalism-shadow {
        box-shadow: 8px 8px 0px 0px rgba(255, 255, 255, 1);
      }
      .neobrutalism-shadow-sm {
        box-shadow: 4px 4px 0px 0px rgba(255, 255, 255, 1);
      }
      .neobrutalism-shadow-active {
        box-shadow: 2px 2px 0px 0px rgba(255, 255, 255, 1);
        transform: translate(2px, 2px);
      }
      /* Hide scrollbar */
      ::-webkit-scrollbar {
        display: none;
      }
      @media print {
        body {
          background-color: white !important;
          color: black !important;
        }
        .neobrutalism-shadow {
          box-shadow: 8px 8px 0px 0px black !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "recharts": "https://esm.sh/recharts@^3.6.0",
          "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
